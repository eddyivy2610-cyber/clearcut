<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Cut - Remove Image Background</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            'cc-bg': '#f3f4f6',
            'cc-dark-bg': '#111827',
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-color: theme('colors.cc-bg');
      background-image: url('/static/bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .dark body {
      background-color: theme('colors.cc-dark-bg');
      background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('/static/bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Checkerboard for the image frame */
    .checkerboard-frame {
      background-color: #e5e7eb;
      background-image:
        linear-gradient(45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(-45deg, #d1d5db 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #d1d5db 75%),
        linear-gradient(-45deg, transparent 75%, #d1d5db 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0px;
    }

    .dark .checkerboard-frame {
      background-color: #374151;
      background-image:
        linear-gradient(45deg, #1f2937 25%, transparent 25%),
        linear-gradient(-45deg, #1f2937 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1f2937 75%),
        linear-gradient(-45deg, transparent 75%, #1f2937 75%);
    }

    /* Soft radial fade on the SVG image */
    .blend-image {
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 60%, rgba(0, 0, 0, 0) 95%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 1) 60%, rgba(0, 0, 0, 0) 95%);
    }

    /* Floating animation */
    @keyframes floatSlow {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="text-gray-900 dark:text-gray-100 min-h-screen flex transition-colors duration-300">

  <!-- Left/Bottom Navigation Pill -->
  <nav
    class="fixed bottom-4 left-1/2 -translate-x-1/2 sm:bottom-auto sm:left-4 sm:translate-x-0 sm:top-1/2 sm:-translate-y-1/2 bg-white/70 dark:bg-gray-900/70 backdrop-blur-md rounded-full shadow-lg p-3 flex flex-row sm:flex-col gap-4 sm:gap-6 z-50 border border-white/30 dark:border-gray-700/50">
    <a href="/" class="p-3 rounded-full bg-black text-white dark:bg-white dark:text-black shadow-md transition-colors"
      title="Home">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
    </a>
    <a href="/upload" class="p-3 rounded-full text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
      title="Upload & Process">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
    </a>
    <a href="/api-docs"
      class="p-3 rounded-full text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
      title="API Docs">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
    </a>
    <div class="hidden sm:block h-px w-full bg-gray-200 dark:bg-gray-700"></div>
    <div class="block sm:hidden w-px h-full bg-gray-200 dark:bg-gray-700"></div>
    <button id="themeToggle"
      class="p-3 rounded-full text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
      title="Toggle Theme">
      <svg id="sunIcon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg id="moonIcon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </nav>

  <!-- Main -->
  <main class="ml-0 sm:ml-24 flex-grow flex items-center justify-center min-h-screen px-6 sm:px-12 pb-24 sm:pb-0">

    <div class="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">

      <!-- LEFT: Text Content -->
      <div class="space-y-6 text-left flex flex-col items-start">

        <!-- Badge -->
        

        <!-- Title -->
        <h1
          class="text-5xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight text-gray-900 dark:text-white leading-[1.1]">
          Remove Image<br />
          <span
            class="bg-gradient-to-r from-blue-600 via-indigo-500 to-purple-600 bg-clip-text text-transparent">Background</span>
        </h1>

        <!-- Subtitle row -->
        <div class="flex flex-wrap items-center gap-3 text-lg sm:text-xl font-medium text-gray-600 dark:text-gray-300">
          <span>100% Automatically and</span>
          <span
            class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm px-4 py-1 rounded-full shadow-md shadow-blue-500/25 tracking-wide uppercase">Free</span>
        </div>

        <!-- Description -->
        <p class="text-base sm:text-lg text-gray-500 dark:text-gray-400 leading-relaxed max-w-md">
          Erase image backgrounds in seconds using our AI-powered U2-Net deep learning model. Batch process, download
          PNG, and customize background colors instantly.
        </p>

        <!-- CTA Button -->
        <a href="/upload"
          class="mt-2 inline-flex items-center gap-3 px-9 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-lg rounded-full shadow-xl shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-105 active:scale-95 transition-all duration-300 group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
          </svg>
          <span>Remove Background</span>
          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>

        <!-- Feature Pills -->
        <div class="flex flex-wrap gap-3 pt-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-medium">
          <div
            class="flex items-center gap-1.5 bg-white/60 dark:bg-gray-800/60 backdrop-blur-sm px-3.5 py-1.5 rounded-xl border border-white/50 dark:border-gray-700/50 shadow-sm">
            <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
            High Precision AI
          </div>
          <div
            class="flex items-center gap-1.5 bg-white/60 dark:bg-gray-800/60 backdrop-blur-sm px-3.5 py-1.5 rounded-xl border border-white/50 dark:border-gray-700/50 shadow-sm">
            <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            Batch Processing
          </div>
          <div
            class="flex items-center gap-1.5 bg-white/60 dark:bg-gray-800/60 backdrop-blur-sm px-3.5 py-1.5 rounded-xl border border-white/50 dark:border-gray-700/50 shadow-sm">
            <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            HD PNG Output
          </div>
        </div>

      </div>

      <!-- RIGHT: Animated SVG in checkerboard bordered frame -->
      <div class="relative flex items-center justify-center order-first lg:order-last">

        <!-- Ambient glow behind the frame -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-blue-400/20 via-indigo-400/15 to-purple-400/20 rounded-3xl blur-3xl scale-110 pointer-events-none">
        </div>

        <!-- Checkerboard frame with border -->
        <div class="relative checkerboard-frame rounded-3xl overflow-hidden
                    border border-white/60 dark:border-white/10
                    shadow-2xl shadow-black/10 dark:shadow-black/40
                    w-full aspect-square max-w-sm sm:max-w-md">

          <!-- Inner soft shadow overlay to blend edges into the checkerboard -->
          <div class="absolute inset-0 rounded-3xl pointer-events-none z-10"
            style="box-shadow: inset 0 0 60px 30px rgba(243,244,246,0.65);">
          </div>
          <div class="absolute inset-0 rounded-3xl pointer-events-none z-10 dark-inset-shadow hidden dark:block"
            style="box-shadow: inset 0 0 60px 30px rgba(17,24,39,0.65);">
          </div>

          <!-- Animated SVG — blended softly into the checkerboard -->
          <img src="/static/remove-bg-animation.svg" alt="AI Background Removal Animation"
            class="w-full h-full object-contain blend-image animate-float p-4" />

        </div>
      </div>

    </div>
  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      html.classList.add('dark');
    }

    themeToggle.addEventListener('click', () => {
      html.classList.toggle('dark');
      localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
    });
  </script>
</body>

</html>
